plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.7.0-alpha.12'
group = 'com.xxsx.xuanhuanearth'
base.archivesName = 'xuanhuan-earth-neoforge-26.1.2'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.1.2.124'

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument('--nogui')
        }
    }

    mods {
        xuanhuan_earth {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        url = uri('https://maven.blamejared.com')
        content {
            includeGroup 'mezz.jei'
        }
    }
}

dependencies {
    compileOnly 'mezz.jei:jei-26.1.2-common-api:29.53.0.112'
    compileOnly 'mezz.jei:jei-26.1.2-neoforge-api:29.53.0.112'
}

jar {
    from('../LICENSE') {
        into 'META-INF'
    }
    manifest {
        attributes([
            'Specification-Title'     : 'Xuanhuan Earth',
            'Specification-Vendor'    : 'xxsx',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'xxsx',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('verifyArcanaBalance', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.xxsx.xuanhuanearth.ArcanaBalanceRegression'
}

tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}

tasks.named('check') {
    dependsOn verifyArcanaBalance
}
